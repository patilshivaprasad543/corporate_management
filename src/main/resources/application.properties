spring.application.name=corporate_management
server.port=${SERVER_PORT:8080}

# Database Configuration (Database Name: corporate)
# By default, uses in-memory H2 database 'corporate' (MySQL compatible) for out-of-box zero-setup execution.
# To use a local or cloud MySQL database named 'corporate', uncomment the MySQL datasource properties below or pass them via environment variables.

spring.datasource.url=jdbc:mysql://localhost:3306/corporate_db
spring.datasource.username=root
spring.datasource.password=Shiva@543
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For MySQL (Uncomment when connecting to MySQL server directly):
# spring.datasource.url=jdbc:mysql://localhost:3306/corporate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# H2 Console Configuration (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SpringDoc / OpenAPI / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:change-me-before-production-use-a-256-bit-secret-key-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# OTP Configuration
app.otp.provider=${OTP_PROVIDER:mock}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
