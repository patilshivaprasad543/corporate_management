<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Business Travel & Expense Platform</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b'
            },
            dark: { 900: '#070d1e', 800: '#0b132b', 700: '#1c2541', 600: '#3a506b', 500: '#5bc0be' }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SockJS & StompJS for WebSocket -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">
  <div id="topAlertBanner" class="bg-gradient-to-r from-indigo-900 via-purple-900 to-slate-900 px-4 py-2 text-xs font-medium text-indigo-200 border-b border-indigo-500/20 flex items-center justify-between no-print">
    <div class="flex items-center gap-2">
      <span class="flex h-2 w-2 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
      <span><strong>DEMO ENVIRONMENT:</strong> Search results and travel advisories use test-provider data unless a live provider is configured.</span>
    </div>
    <div class="flex items-center gap-4"><a href="/swagger-ui/index.html" target="_blank" class="hover:text-white flex items-center gap-1 underline underline-offset-2"><i data-lucide="file-code-2" class="w-3.5 h-3.5"></i> Swagger API Docs</a></div>
  </div>

  <header class="bg-dark-800/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between no-print">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30"><i data-lucide="plane-takeoff" class="w-6 h-6"></i></div>
      <div><div class="flex items-center gap-2"><h1 class="font-extrabold text-lg tracking-tight text-white">CorporateTravel<span class="text-indigo-400">360</span></h1><span class="text-[9px] px-2 py-0.5 rounded-full border border-indigo-500/30 text-indigo-300">ENTERPRISE</span></div><p class="text-[10px] text-slate-500 uppercase tracking-widest">Travel & Expense Management</p></div>
    </div>
    <div id="headerActions" class="flex items-center gap-2"></div>
  </header>

  <div id="app" class="flex flex-1 min-h-0">
    <aside id="sidebar" class="w-72 bg-dark-800/80 border-r border-slate-800 flex flex-col no-print">
      <div id="sidebarHeader" class="p-4 border-b border-slate-800"></div>
      <nav id="mainNav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
      <div id="sidebarFooter" class="p-3 border-t border-slate-800"></div>
    </aside>
    <main class="flex-1 overflow-y-auto p-4 lg:p-8 space-y-6" id="mainContent"></main>
  </div>

  <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3 no-print">
    <button onclick="openAiModal()" class="flex items-center gap-2 px-4 py-3 rounded-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold text-sm shadow-xl shadow-indigo-500/30 hover:shadow-indigo-500/50 hover:scale-105 transition-all"><i data-lucide="sparkles" class="w-4 h-4 animate-pulse"></i> AI Assistant</button>
    <button onclick="toggleLiveChatDrawer()" class="p-3.5 rounded-full bg-dark-800 border border-indigo-500/40 text-indigo-400 hover:text-white hover:bg-dark-700 shadow-xl transition"><i data-lucide="messages-square" class="w-5 h-5"></i></button>
  </div>

  <div id="modalContainer" class="relative z-50"></div>
  <div id="notifModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-end p-4"><div class="w-full max-w-md bg-dark-800 border border-slate-700 rounded-2xl shadow-2xl p-6 h-[80vh] flex flex-col"><div class="flex items-center justify-between pb-4 border-b border-slate-700"><div class="flex items-center gap-2"><i data-lucide="bell" class="w-5 h-5 text-indigo-400"></i><h3 class="font-bold text-lg text-white">Notifications & Alerts</h3></div><button onclick="toggleNotificationsModal()" class="text-slate-400 hover:text-white p-1 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button></div><div id="notifListContainer" class="flex-1 overflow-y-auto py-4 space-y-3"></div></div></div>
  <div id="chatDrawer" class="hidden fixed bottom-24 right-6 w-96 bg-dark-800 border border-slate-700 rounded-2xl shadow-2xl z-50 flex flex-col h-[520px]"><div class="p-4 bg-gradient-to-r from-indigo-900 to-slate-900 rounded-t-2xl border-b border-slate-700 flex items-center justify-between"><div class="flex items-center gap-2.5"><div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div><div><h4 class="font-bold text-sm text-white">Live Corporate Support</h4><p class="text-[10px] text-indigo-300">24/7 Traveler Care Desk</p></div></div><button onclick="toggleLiveChatDrawer()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div><div id="chatMessagesBox" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs"></div><div class="p-3 border-t border-slate-700 flex items-center gap-2"><input id="chatInputText" type="text" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendChatMessage()" class="flex-1 bg-dark-900 text-xs text-white border border-slate-700 rounded-xl px-3 py-2 outline-none focus:border-indigo-500"><button onclick="sendChatMessage()" class="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition"><i data-lucide="send" class="w-4 h-4"></i></button></div></div>

  <script src="/app.js"></script>
  <script src="/portal-policy.js"></script>
</body>
</html>
