# MySQL production profile — Flyway owns schema; Hibernate validates only
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/corporate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:corporate_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:corporate_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
